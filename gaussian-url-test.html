<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D-World Gaussian URL Test</title>
  <style>
    body {
      margin: 0;
      background: #f7f4fb;
      color: #241936;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 24px auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.2;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
    }

    button,
    select {
      min-height: 36px;
      border: 1px solid #d8cce8;
      border-radius: 8px;
      background: #fff;
      color: #241936;
      font: inherit;
    }

    button {
      padding: 0 12px;
      cursor: pointer;
    }

    button.is-active {
      border-color: #9b4dde;
      background: #9b4dde;
      color: #fff;
    }

    select {
      padding: 0 10px;
    }

    .status {
      margin: 0 0 12px;
      color: #6d5e80;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .viewer {
      position: relative;
      min-height: 68vh;
      border: 1px solid #d8cce8;
      border-radius: 8px;
      overflow: hidden;
      background: #0f1115;
    }

    iframe {
      display: block;
      width: 100%;
      height: 68vh;
      border: 0;
      background: #0f1115;
    }
  </style>
</head>
<body>
  <main>
    <h1>Gaussian URL Test</h1>
    <div class="toolbar">
      <select id="base">
        <option value="https://dworld.oss-cn-hongkong.aliyuncs.com/final_gaussian_scenes/">OSS default domain</option>
        <option value="https://assets.dworld.xin/final_gaussian_scenes/">assets.dworld.xin</option>
      </select>
      <button type="button" data-file="example1_0s_scene_0436_frame_0060.ply">Example 1 0s</button>
      <button type="button" data-file="example1_5s_scene_0436_frame_0120.ply">Example 1 5s</button>
      <button type="button" data-file="example1_10s_scene_0436_frame_0160.ply">Example 1 10s</button>
      <button type="button" data-file="example1_15s_scene_0436_frame_0220.ply">Example 1 15s</button>
      <button type="button" data-file="example2_0s_scene_0547_frame_0030.ply">Example 2 0s</button>
      <button type="button" data-file="example2_5s_scene_0547_frame_0090.ply">Example 2 5s</button>
      <button type="button" data-file="example2_10s_scene_0547_frame_0150.ply">Example 2 10s</button>
      <button type="button" data-file="example2_15s_scene_0547_frame_0200.ply">Example 2 15s</button>
      <button type="button" data-file="example3_0s_scene_0503_frame_0000.ply">Example 3 0s</button>
      <button type="button" data-file="example3_5s_scene_0503_frame_0070.ply">Example 3 5s</button>
      <button type="button" data-file="example3_10s_scene_0503_frame_0150.ply">Example 3 10s</button>
      <button type="button" data-file="example3_15s_scene_0503_frame_0170.ply">Example 3 15s</button>
    </div>
    <p class="status" id="status"></p>
    <div class="viewer" id="viewer"></div>
  </main>

  <script>
    const base = document.getElementById("base");
    const status = document.getElementById("status");
    const viewer = document.getElementById("viewer");
    const buttons = [...document.querySelectorAll("[data-file]")];
    let activeFile = buttons[0].dataset.file;

    const loadFile = (file) => {
      activeFile = file;
      buttons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.file === file);
      });

      const url = base.value + file;
      status.textContent = url;
      viewer.replaceChildren();

      const frame = document.createElement("iframe");
      frame.title = file;
      frame.allow = "fullscreen";
      frame.src = `spark-rotate-video.html?v=single-test&src=${encodeURIComponent(url)}`;
      viewer.appendChild(frame);
    };

    buttons.forEach((button) => {
      button.addEventListener("click", () => loadFile(button.dataset.file));
    });
    base.addEventListener("change", () => loadFile(activeFile));
    loadFile(activeFile);
  </script>
</body>
</html>
